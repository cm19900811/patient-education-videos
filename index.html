<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胸外宣教视频</title><style>body{margin:0;background:#f4f7fa;color:#183047;font:18px system-ui,sans-serif}main{max-width:960px;margin:24px auto;padding:20px}h1{font-size:28px}video{width:100%;max-height:65vh;background:#000;border-radius:12px}p{line-height:1.7;color:#526579}nav{display:grid;gap:10px;margin:20px 0}button{font:inherit;padding:16px;border:1px solid #adc5d6;border-radius:10px;background:white;color:#183047;text-align:left;cursor:pointer}button[aria-pressed=true]{background:#17689c;color:white}a{color:#17689c}#status{min-height:1.7em}</style><main><h1>胸外宣教视频</h1><p>共三节。点击选择一节后播放，仅加载所选视频。</p><nav aria-label="选择视频章节"><button data-part="1" aria-pressed="false">第一节 · 0:00—1:45（1分45秒）</button><button data-part="2" aria-pressed="false">第二节 · 1:45—4:16（2分31秒）</button><button data-part="3" aria-pressed="false">第三节 · 4:16—结束（约2分31秒）</button></nav><h2 id="heading">请选择章节</h2><video id="player" controls playsinline webkit-playsinline x5-playsinline preload="none"></video><p id="status" role="status">请选择上方任一章节。</p><p><a id="direct" hidden>直接打开本节视频</a></p><p>如微信内无法播放，请点击右上角“…”选择在浏览器中打开。</p></main><script>const v=document.getElementById('player'),s=document.getElementById('status'),h=document.getElementById('heading'),a=document.getElementById('direct');document.querySelectorAll('button[data-part]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));v.pause();v.src='./part-'+b.dataset.part+'.mp4';v.load();h.textContent=b.textContent;a.href=v.src;a.hidden=false;s.textContent='正在加载所选章节…';v.play().catch(()=>{s.textContent='请点击视频中的播放按钮。'});}));v.addEventListener('waiting',()=>s.textContent='正在加载，请稍候…');v.addEventListener('playing',()=>s.textContent='');v.addEventListener('error',()=>s.textContent='加载失败，请尝试直接打开本节视频，或在浏览器中打开本页。');</script></html>
